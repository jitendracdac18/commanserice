global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app-service:8080']

  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:3306']
